<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Circuit</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--fg:#fff;--panel:rgba(20,10,45,.7);--accent:#ffe14d;--neon:#ff3df2;--cyan:#38f0ff}
*,*:before,*:after{box-sizing:inherit}
html,body{height:100%;margin:0;background:#1a0b3a;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg);touch-action:none;user-select:none;-webkit-user-select:none}
canvas.main{display:block;position:fixed;inset:0;width:100%;height:100%}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;right:12px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;pointer-events:none}
.pill{background:var(--panel);padding:8px 14px;border-radius:12px;font-weight:600;font-variant-numeric:tabular-nums;backdrop-filter:blur(6px);border:1px solid rgba(56,240,255,.45);box-shadow:0 0 14px rgba(255,61,242,.3);letter-spacing:.04em;text-transform:uppercase;font-size:12px}
.pill b{color:var(--accent);font-size:20px}
#big{position:fixed;left:0;right:0;top:26%;text-align:center;font-size:clamp(56px,16vw,120px);font-weight:900;font-style:italic;color:#fff;text-shadow:0 0 24px var(--neon),0 0 48px var(--cyan);pointer-events:none}
#map{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 64px);width:120px;height:120px;border-radius:12px;background:var(--panel);border:1px solid rgba(56,240,255,.45);pointer-events:none}
.bar{position:fixed;left:50%;margin-left:-80px;width:160px;height:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);background:var(--panel);border-radius:6px;overflow:hidden;pointer-events:none}
.bar i{display:block;height:100%;width:100%;background:#4fc3ff}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,15,25,.6);z-index:5}
.card{background:var(--panel);padding:28px 32px;border-radius:18px;text-align:center;max-width:90%;backdrop-filter:blur(8px);border:1px solid var(--neon);box-shadow:0 0 30px rgba(255,61,242,.4)}
.card h1{margin:0 0 6px;font-size:40px;font-style:italic;letter-spacing:.06em;background:linear-gradient(90deg,var(--cyan),var(--neon));-webkit-background-clip:text;background-clip:text;color:transparent}
.card p{margin:6px 0 18px;opacity:.85;line-height:1.5}
button.go{background:var(--accent);color:#222;border:0;font-size:18px;font-weight:700;padding:12px 28px;border-radius:12px;cursor:pointer}
.hidden{display:none}
.pad{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:none;gap:10px}
.pad.l{left:16px}.pad.r{right:16px}
.pad div{width:68px;height:68px;border-radius:50%;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:26px;touch-action:none}
.pad div.on{background:var(--accent);color:#222}
@media (pointer:coarse){.pad{display:flex}#map{top:calc(env(safe-area-inset-top,0px) + 100px)}}
</style>
</head>
<body>
<div class="hud">
  <div class="pill">Lap <b id="lap">1/3</b></div>
  <div class="pill">Pos <b id="pos">4/4</b></div>
  <div class="pill">Time <b id="time">0:00.0</b></div>
  <div class="pill"><b id="spd">0</b> km/h</div>
</div>
<div id="big"></div>
<canvas id="map" width="240" height="240"></canvas>
<div class="bar"><i id="nitro"></i></div>
<div class="pad l"><div data-k="left">◀</div><div data-k="right">▶</div></div>
<div class="pad r"><div data-k="boost">⚡</div><div data-k="brake">▼</div><div data-k="gas">▲</div></div>
<div class="overlay" id="menu"><div class="card">
  <h1 id="title">Neon Circuit</h1>
  <p id="msg">3 laps against 3 rivals.<br>WASD / arrows to drive, Space to brake, Shift for nitro.<br>Stay on the asphalt: grass slows you down.</p>
  <button class="go" id="start">Start race</button>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const LAPS = 3, N = 360, W = 13;
  const $ = id=>document.getElementById(id);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a0b3a);
  scene.fog = new THREE.Fog(0x1a0b3a, 60, 260);
  const camera = new THREE.PerspectiveCamera(65, 1, 0.1, 500);
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.domElement.className = 'main';
  document.body.prepend(renderer.domElement);
  scene.add(new THREE.HemisphereLight(0x8c7cff, 0x221144, 0.95));
  const sun = new THREE.DirectionalLight(0xffffff, 0.8);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, {left:-50, right:50, top:50, bottom:-50, near:10, far:220});
  scene.add(sun, sun.target);

  // Neon grid ground
  const gc = document.createElement('canvas'); gc.width = gc.height = 128;
  const gx = gc.getContext('2d');
  gx.fillStyle = '#140a2e'; gx.fillRect(0,0,128,128);
  gx.strokeStyle = '#38f0ff'; gx.lineWidth = 4; gx.strokeRect(0,0,128,128);
  const gt = new THREE.CanvasTexture(gc); gt.wrapS = gt.wrapT = THREE.RepeatWrapping; gt.repeat.set(150, 150);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), new THREE.MeshLambertMaterial({map:gt, emissive:0xffffff, emissiveMap:gt, emissiveIntensity:0.5}));
  ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

  // Track
  const curve = new THREE.CatmullRomCurve3([[0,-120],[110,-120],[170,-40],[120,40],[160,120],[40,160],[-60,110],[-130,150],[-190,60],[-120,-30],[-170,-100],[-80,-150]].map(p=>new THREE.Vector3(p[0],0,p[1])), true, 'centripetal');
  const pts = curve.getSpacedPoints(N).slice(0, N);
  const tang = pts.map((p,i)=>{ const q = pts[(i+1)%N], dx = q.x-p.x, dz = q.z-p.z, l = Math.hypot(dx,dz); return {x:dx/l, z:dz/l}; });
  function ribbon(a, b, y, mat, dash){
    const pos = [], idx = [];
    for (let i=0;i<N;i++){ const p = pts[i], t = tang[i], lx = t.z, lz = -t.x; pos.push(p.x+lx*a, y, p.z+lz*a, p.x+lx*b, y, p.z+lz*b); }
    for (let i=0;i<N;i++){ if (dash && i%4 > 1) continue; const A = i*2, B = ((i+1)%N)*2; idx.push(A, A+1, B, A+1, B+1, B); }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
    const m = new THREE.Mesh(g, mat); m.receiveShadow = true; scene.add(m);
  }
  const DS = THREE.DoubleSide;
  ribbon(-W, W, 0.04, new THREE.MeshLambertMaterial({color:0x2a2542, side:DS}));
  ribbon(W-1.2, W, 0.07, new THREE.MeshBasicMaterial({color:0x38f0ff, side:DS}));
  ribbon(-W, -W+1.2, 0.07, new THREE.MeshBasicMaterial({color:0xff3df2, side:DS}));
  ribbon(-0.3, 0.3, 0.07, new THREE.MeshBasicMaterial({color:0xcccccc, side:DS}), true);

  // Start line + gantry
  const h0 = Math.atan2(tang[0].x, tang[0].z);
  const sl = new THREE.Group(); sl.position.set(pts[0].x, 0, pts[0].z); sl.rotation.y = h0; scene.add(sl);
  const cc = document.createElement('canvas'); cc.width = 128; cc.height = 32;
  const cx = cc.getContext('2d');
  for (let i=0;i<16;i++) for (let j=0;j<4;j++){ cx.fillStyle = (i+j)%2 ? '#fff' : '#111'; cx.fillRect(i*8, j*8, 8, 8); }
  const line = new THREE.Mesh(new THREE.PlaneGeometry(W*2, 4), new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cc)}));
  line.rotation.x = -Math.PI/2; line.position.y = 0.09; sl.add(line);
  const glowM = new THREE.MeshBasicMaterial({color:0xff3df2});
  [-W-1, W+1].forEach(x=>{ const p = new THREE.Mesh(new THREE.BoxGeometry(1, 9, 1), glowM); p.position.set(x, 4.5, 0); sl.add(p); });
  const bar = new THREE.Mesh(new THREE.BoxGeometry(W*2+3, 1.4, 1), new THREE.MeshBasicMaterial({color:0x38f0ff})); bar.position.y = 9; sl.add(bar);

  // Cars
  const paintOf = c=>new THREE.MeshStandardMaterial({color:c, metalness:0.35, roughness:0.35});
  const glassM = new THREE.MeshStandardMaterial({color:0x0b1c2c, metalness:0.9, roughness:0.08, emissive:0x0a1626});
  const blackM = new THREE.MeshLambertMaterial({color:0x111111});
  const chromeM = new THREE.MeshLambertMaterial({color:0xdde3e8, emissive:0x333a40});
  const lampM = new THREE.MeshBasicMaterial({color:0xfffbe0});
  const extr = (pts2, depth)=>{
    const sh = new THREE.Shape(); sh.moveTo(pts2[0][0], pts2[0][1]);
    for (let i=1;i<pts2.length;i++) sh.lineTo(pts2[i][0], pts2[i][1]);
    const geo = new THREE.ExtrudeGeometry(sh, {depth, bevelEnabled:true, bevelSize:0.1, bevelThickness:0.1, bevelSegments:2, steps:1});
    geo.translate(0, 0, -depth/2); geo.rotateY(-Math.PI/2); return geo;
  };
  const bodyG = extr([[-2.1,0.3],[2.1,0.3],[2.15,0.7],[1.5,0.95],[0.7,1.0],[-1.6,1.0],[-2.1,0.9]], 1.6);
  const cabG = extr([[0.75,1.05],[0.15,1.5],[-0.85,1.5],[-1.4,1.05]], 1.3);
  const roofG = new THREE.BoxGeometry(1.4, 0.06, 1.15), wingG = new THREE.BoxGeometry(1.9, 0.07, 0.5);
  const tireG = new THREE.CylinderGeometry(0.46, 0.46, 0.38, 20).rotateZ(Math.PI/2);
  const rimG = new THREE.CylinderGeometry(0.3, 0.3, 0.4, 16).rotateZ(Math.PI/2);
  const spokeG = new THREE.BoxGeometry(0.04, 0.56, 0.07);
  function makeCar(color, hero){
    const g = new THREE.Group(), wheels = [], pivots = [], paint = paintOf(color);
    const add = (geo, mat, x, y, z)=>{ const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; g.add(m); return m; };
    add(bodyG, paint, 0, 0, 0); add(cabG, glassM, 0, 0, 0); add(roofG, paint, 0, 1.62, -0.35);
    add(wingG, paint, 0, 1.45, -2.0);
    [-0.6, 0.6].forEach(x=>add(new THREE.BoxGeometry(0.08, 0.3, 0.1), blackM, x, 1.27, -1.95));
    [[-1,1.35],[1,1.35],[-1,-1.35],[1,-1.35]].forEach(p=>{
      const pv = new THREE.Group(), sp = new THREE.Group(); pv.position.set(p[0]*0.98, 0.46, p[1]);
      sp.add(new THREE.Mesh(tireG, blackM), new THREE.Mesh(rimG, chromeM));
      for (let i=0;i<3;i++){ const s = new THREE.Mesh(spokeG, blackM); s.position.x = p[0]*0.205; s.rotation.x = i*Math.PI/3; sp.add(s); }
      pv.add(sp); g.add(pv); wheels.push(sp); if (p[1] > 0) pivots.push(pv);
    });
    const tail = new THREE.MeshBasicMaterial({color:0x990000});
    [-0.62, 0.62].forEach(x=>add(new THREE.BoxGeometry(0.45, 0.12, 0.1), lampM, x, 0.76, 2.24));
    add(new THREE.BoxGeometry(1.5, 0.1, 0.08), tail, 0, 0.86, -2.25);
    add(new THREE.BoxGeometry(1.9, 0.05, 0.45), blackM, 0, 0.22, 2.2);
    const ug = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 4.4), new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.45, blending:THREE.AdditiveBlending, depthWrite:false}));
    ug.rotation.x = -Math.PI/2; ug.position.y = 0.06; g.add(ug);
    if (hero){
      const beam = new THREE.SpotLight(0xfff4d0, 1.3, 45, 0.5, 0.6);
      beam.position.set(0, 0.9, 2.2); beam.target.position.set(0, 0, 18); g.add(beam, beam.target);
    }
    scene.add(g);
    return {g, wheels, pivots, tail, x:0, z:0, h:0, v:0, idx:0, lap:0, dist:0, prog:0, steer:0, fin:false, lane:0, vmax:0};
  }
  const cars = [makeCar(0xe53935, true), makeCar(0x2979ff), makeCar(0xffb300), makeCar(0x00e676)];
  const P = cars[0];
  cars[1].lane = -6; cars[1].vmax = 33; cars[2].lane = 6; cars[2].vmax = 35; cars[3].lane = 0; cars[3].vmax = 37;
  const slots = [3, 0, 1, 2]; // player starts at the back of the grid

  // State
  const st = {state:'menu', cd:0, t:0, lapStart:0, nitro:100, boost:false, shake:0};
  const keys = {left:false, right:false, gas:false, brake:false, boost:false};
  const map = {ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'gas',KeyW:'gas',ArrowDown:'brake',KeyS:'brake',Space:'brake',ShiftLeft:'boost',ShiftRight:'boost'};
  addEventListener('keydown', e=>{ const k = map[e.code]; if (k){ keys[k] = true; e.preventDefault(); } });
  addEventListener('keyup', e=>{ const k = map[e.code]; if (k) keys[k] = false; });
  addEventListener('blur', ()=>{ for (const k in keys) keys[k] = false; });
  document.querySelectorAll('.pad div').forEach(b=>{
    const k = b.dataset.k;
    b.addEventListener('pointerdown', e=>{ keys[k] = true; b.classList.add('on'); e.preventDefault(); });
    ['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t, ()=>{ keys[k] = false; b.classList.remove('on'); }));
  });

  // Audio + records
  let ac, eng, engG, bestLap = 0;
  try { bestLap = +localStorage.getItem('neoncircuit') || 0; } catch(e) {}
  function initAudio(){
    try {
      if (!ac){
        ac = new (window.AudioContext || window.webkitAudioContext)();
        eng = ac.createOscillator(); eng.type = 'sawtooth';
        engG = ac.createGain(); engG.gain.value = 0; eng.connect(engG); engG.connect(ac.destination); eng.start();
      }
      if (ac.state === 'suspended') ac.resume();
    } catch(e) {}
  }
  function beep(f, d, t, v){
    if (!ac) return;
    try {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = t || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(v || 0.12, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d);
      o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
    } catch(e) {}
  }

  // Race logic
  function nearest(c, full){
    let best = 1e18, bi = c.idx;
    const a = full ? 0 : c.idx - 14, b = full ? N-1 : c.idx + 14;
    for (let k=a;k<=b;k++){
      const i = (k + N) % N, dx = c.x - pts[i].x, dz = c.z - pts[i].z, d = dx*dx + dz*dz;
      if (d < best){ best = d; bi = i; }
    }
    let crossed = 0;
    if (c.idx > N*0.75 && bi < N*0.25){ c.lap++; crossed = 1; } else if (c.idx < N*0.25 && bi > N*0.75) c.lap--;
    c.idx = bi; c.dist = Math.sqrt(best); c.prog = c.lap*N + bi;
    return crossed;
  }
  const order = [];
  const fmt = t=>Math.floor(t/60) + ':' + (t % 60).toFixed(1).padStart(4, '0');
  const menu = $('menu'), big = $('big');
  function reset(){
    cars.forEach((c, k)=>{
      const s = slots[k], i = N - 4 - (s >> 1)*3, off = (s & 1) ? 5 : -5, p = pts[i], t = tang[i];
      c.x = p.x + t.z*off; c.z = p.z - t.x*off; c.h = Math.atan2(t.x, t.z);
      c.v = 0; c.lap = 0; c.idx = i; c.fin = false; c.steer = 0; nearest(c, false);
    });
    order.length = 0;
    Object.assign(st, {state:'count', cd:3.99, t:0, lapStart:0, nitro:100, boost:false, shake:0});
    camPos.set(P.x - Math.sin(P.h)*11, 6, P.z - Math.cos(P.h)*11);
  }
  $('start').addEventListener('click', ()=>{ initAudio(); reset(); menu.classList.add('hidden'); });

  function finishRace(){
    st.state = 'done';
    const rank = order.indexOf(P) + 1;
    $('title').textContent = rank === 1 ? 'Victory!' : 'P' + rank + ' of 4';
    $('msg').innerHTML = 'Race time <b>' + fmt(st.t) + '</b><br>Best lap: ' + (bestLap ? fmt(bestLap) : '-');
    $('start').textContent = 'Race again';
    menu.classList.remove('hidden');
  }

  function update(dt){
    const racing = st.state === 'race';
    if (st.state === 'count'){
      const n = Math.ceil(st.cd); st.cd -= dt;
      const m = Math.ceil(st.cd);
      if (st.cd <= 0){ st.state = 'race'; big.textContent = 'GO!'; beep(880, 0.4, 'square', 0.1); setTimeout(()=>{ if (st.state === 'race') big.textContent = ''; }, 800); }
      else { big.textContent = m; if (m !== n) beep(440, 0.15, 'square', 0.1); }
    }
    if (racing) st.t += dt;

    // Player
    const boosting = racing && keys.boost && st.nitro > 0 && P.v > 5;
    st.boost = boosting;
    st.nitro = Math.max(0, Math.min(100, st.nitro + (boosting ? -35 : 12)*dt));
    if (racing){
      if (keys.gas || boosting) P.v += (boosting ? 45 : 28)*dt;
      if (keys.brake) P.v -= (P.v > 0 ? 50 : 20)*dt;
      if (!keys.gas && !keys.brake){ const d = 10*dt; P.v = Math.abs(P.v) <= d ? 0 : P.v - Math.sign(P.v)*d; }
      const lim = P.dist > W + 10 ? 10 : P.dist > W ? 20 : 1e9;
      if (P.v > lim) P.v -= (P.v - lim)*3*dt;
      P.v = Math.max(-12, Math.min(boosting ? 62 : 42, P.v));
    } else P.v *= Math.max(0, 1 - 3*dt);
    P.steer = racing ? (keys.left?1:0) - (keys.right?1:0) : 0;
    P.h += P.steer * 1.9 * Math.max(-1, Math.min(1, P.v/8)) * dt;

    // Rivals
    const gap0 = P.prog;
    for (let i=1;i<4;i++){
      const c = cars[i];
      if (st.state === 'count'){ c.v = 0; continue; }
      const ti = (c.idx + 6 + Math.floor(c.v/9)) % N, tp = pts[ti], tn = tang[ti];
      const tx = tp.x + tn.z*c.lane, tz = tp.z - tn.x*c.lane;
      let da = Math.atan2(tx - c.x, tz - c.z) - c.h; da = Math.atan2(Math.sin(da), Math.cos(da));
      c.h += Math.max(-1, Math.min(1, da*3)) * 2.4 * Math.min(1, c.v/8) * dt;
      const vm = c.vmax * (1 + Math.max(-0.08, Math.min(0.12, (gap0 - c.prog)/N*1.5)));
      const tv = vm * (1 - Math.min(0.5, Math.abs(da)*0.8));
      c.v += Math.max(-40*dt, Math.min(22*dt, tv - c.v));
      c.steer = Math.sign(da) * Math.min(1, Math.abs(da)*3);
    }

    // Move + track position
    const prevLap = P.lap;
    cars.forEach(c=>{
      c.x += Math.sin(c.h)*c.v*dt; c.z += Math.cos(c.h)*c.v*dt;
      const crossed = nearest(c, false);
      if (c !== P && c.dist > W) c.v *= Math.exp(-2*dt);
      if (c.lap > LAPS && !c.fin){ c.fin = true; order.push(c); }
    });
    if (P.dist > W + 70){ const p = pts[P.idx]; P.x = p.x; P.z = p.z; P.h = Math.atan2(tang[P.idx].x, tang[P.idx].z); P.v = 0; }
    if (P.lap > prevLap && P.lap >= 2 && racing){
      const lt = st.t - st.lapStart; st.lapStart = st.t; beep(1000, 0.2, 'triangle', 0.12);
      if (!bestLap || lt < bestLap){ bestLap = lt; try { localStorage.setItem('neoncircuit', lt); } catch(e) {} }
    }
    // Car vs car
    for (let i=0;i<4;i++) for (let j=i+1;j<4;j++){
      const a = cars[i], b = cars[j], dx = b.x - a.x, dz = b.z - a.z, d = Math.hypot(dx, dz);
      if (d < 3.6 && d > 0.001){
        const o = (3.6 - d)/2, nx = dx/d, nz = dz/d;
        a.x -= nx*o; a.z -= nz*o; b.x += nx*o; b.z += nz*o;
        a.v *= 0.985; b.v *= 0.985;
        if (i === 0 && P.v > 8){ st.shake = Math.max(st.shake, 0.3); beep(120, 0.1, 'square', 0.08); }
      }
    }
    if (racing && P.lap > LAPS) finishRace();
  }

  function resize(){
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();

  // Minimap background (track outline), drawn once
  let minX = 1e9, maxX = -1e9, minZ = 1e9, maxZ = -1e9;
  pts.forEach(p=>{ minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minZ = Math.min(minZ, p.z); maxZ = Math.max(maxZ, p.z); });
  const MS = 240, mk = (MS - 24)/Math.max(maxX - minX, maxZ - minZ);
  const mx = x=>(maxX - x)*mk + 12, my = z=>(maxZ - z)*mk + 12;
  const mbg = document.createElement('canvas'); mbg.width = mbg.height = MS;
  { const m = mbg.getContext('2d'); m.strokeStyle = '#6b5aa8'; m.lineWidth = 10; m.lineJoin = 'round'; m.beginPath();
    pts.forEach((p,i)=>i ? m.lineTo(mx(p.x), my(p.z)) : m.moveTo(mx(p.x), my(p.z))); m.closePath(); m.stroke(); }
  const mctx = $('map').getContext('2d'), dots = ['#38f0ff', '#2979ff', '#ffb300', '#00e676'];

  const clock = new THREE.Clock(), camPos = new THREE.Vector3(0, 6, -11);
  function frame(){
    requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), 0.05);
    if (st.state !== 'menu') update(dt);
    cars.forEach(c=>{
      c.g.position.set(c.x, 0, c.z); c.g.rotation.y = c.h;
      c.wheels.forEach(w=>{ w.rotation.x += c.v*dt/0.46; });
      c.pivots.forEach(pv=>{ pv.rotation.y += (c.steer*0.45 - pv.rotation.y)*Math.min(1, 10*dt); });
      c.g.rotation.z += (c.steer*Math.min(1, Math.abs(c.v)/40)*0.06 - c.g.rotation.z)*Math.min(1, 6*dt);
    });
    P.tail.color.setHex(keys.brake ? 0xff4040 : 0x990000);

    const fx = Math.sin(P.h), fz = Math.cos(P.h);
    camPos.lerp(new THREE.Vector3(P.x - fx*11, 6, P.z - fz*11), 1 - Math.exp(-6*dt));
    camera.position.copy(camPos);
    if (st.shake > 0.01){ camera.position.x += (Math.random()-.5)*st.shake; camera.position.y += (Math.random()-.5)*st.shake; st.shake *= Math.exp(-8*dt); }
    const tf = 65 + Math.min(1, Math.abs(P.v)/42)*10 + (st.boost ? 10 : 0);
    camera.fov += (tf - camera.fov)*(1 - Math.exp(-5*dt)); camera.updateProjectionMatrix();
    camera.lookAt(P.x + fx*6, 1.5, P.z + fz*6);
    sun.target.position.set(P.x, 0, P.z); sun.position.set(P.x + 40, 80, P.z + 30);

    // HUD
    const rank = P.fin ? order.indexOf(P) + 1 : 1 + cars.filter(c=>c !== P && (c.fin || c.prog > P.prog)).length;
    $('lap').textContent = Math.max(1, Math.min(P.lap, LAPS)) + '/' + LAPS;
    $('pos').textContent = rank + '/4';
    $('time').textContent = fmt(st.t);
    $('spd').textContent = Math.round(Math.abs(P.v)*3.6);
    $('nitro').style.width = st.nitro + '%';
    mctx.clearRect(0, 0, MS, MS); mctx.drawImage(mbg, 0, 0);
    for (let i=3;i>=0;i--){ const c = cars[i]; mctx.fillStyle = dots[i]; mctx.beginPath(); mctx.arc(mx(c.x), my(c.z), i ? 6 : 8, 0, 7); mctx.fill(); }
    if (eng){ eng.frequency.value = 50 + Math.abs(P.v)*3.5 + (st.boost ? 25 : 0); engG.gain.value = (st.state === 'race' || st.state === 'count') ? 0.025 : 0; }
    renderer.render(scene, camera);
  }
  reset(); st.state = 'menu';
  frame();
})();
</script>
</body>
</html>
